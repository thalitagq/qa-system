name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Unit, integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_DB: qa_system_test
          POSTGRES_USER: qa_test_user
          # Credentials are used only by this ephemeral database.
          POSTGRES_PASSWORD: qa_ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_test_user -d qa_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Create temporary test environment
        shell: bash
        run: |
          database_password="qa_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          printf '::add-mask::%s\n' "$database_password"
          umask 077
          printf 'TEST_DATABASE_URL="postgresql://qa_test_user:%s@127.0.0.1:5432/qa_system_test"\n' \
            "$database_password" > .env.test

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx --no-install prisma generate --config prisma.integration.config.ts

      - name: Apply test database migrations
        run: npx --no-install prisma migrate deploy --config prisma.integration.config.ts

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run integration tests
        run: npm run test:integration

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Remove temporary test environment
        if: always()
        run: rm -f -- .env.test
